version: 2

project_name: teicos

before:
  hooks:
    - rm -rf .goreleaser-provenance
    - mkdir -p .goreleaser-provenance
    - go run ./internal/releaseprovenancecmd --out .goreleaser-provenance/manifest.json --config .goreleaser.yaml --goreleaser-version v2.15.2

builds:
  - main: ./cmd/teicos
    binary: teicos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X github.com/Santiago1809/teicos/internal/update/upgrade.releaseMinisignPublicKeys={{ .Env.MINISIGN_PUBLIC_KEYS_CANONICAL }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  - id: release-provenance
    meta: true
    formats:
      - tar.gz
    name_template: "teicos-release-provenance-v1"
    files:
      - src: .goreleaser-provenance/manifest.json
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign only the checksum manifest. The signed trusted comment binds the exact
# repository and tag; the updater rejects a valid signature copied from any
# other release identity.
signs:
  - cmd: minisign
    artifacts: checksum
    signature: ${artifact}.minisig
    args:
      - "-S"
      - "-s"
      - "{{ .Env.MINISIGN_SECRET_KEY_FILE }}"
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
      - "-c"
      - "signature from teicos release"
      - "-t"
      - "repo=Santiago1809/teicos;tag={{ .Tag }}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: Gentleman-Programming
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: teicos
    homepage: "https://github.com/Santiago1809/teicos"
    description: "Teicos — The wall in the code."
    license: "MIT"
    commit_msg_template: "chore: update teicos formula to {{ .Tag }}"
